<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#f7f8f9">
  $robots
  $canonical
  <title>$name</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="academic-site">
  <!-- Static HTML generated from content.json by tools/build.py. -->
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="layout">
    <header class="sidebar">
      $portrait
      <nav class="page-nav" aria-label="Sections">$nav</nav>
    </header>
    <main id="main-content">
      <section id="overview" class="overview" aria-labelledby="page-title">
        <div class="overview-profile">
          <h1 id="page-title">$name</h1>
          $resources
        </div>
        $bio
        $interests
        $glance
      </section>
      $sections
      <footer><a href="#overview">Back to top ↑</a></footer>
    </main>
  </div>
</body>
</html>
